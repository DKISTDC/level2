image: haskell:9.6.7              # Explicitly targets GHC 9.6.7 and associated Cabal CLI

definitions:
  caches:
    cabal-deps:
      key:
        files:
          - cabal.project
          - "*.cabal"
      path: ~/.cabal

pipelines:
  default:
    - step:
        name: System Dependencies
        caches:
          - cabal-deps
        script:
          - apt-get update
          - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libpq-dev pkg-config ca-certificates
          - rm -rf /var/lib/apt/lists/*
          - pg_config --version # Sanity check matching your old CI
    - step:
        name: Cabal Dependencies
        caches:
          - cabal-deps
        script:
          - cabal update
          - cabal build --only-dependencies --enable-tests
    - step:
        name: Cabal Test
        caches:
          - cabal-deps
        script:
          - cabal test
