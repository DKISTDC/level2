image: haskell:9.10.3-bookworm

definitions:
  caches:
    cabal-deps:
      key:
        files:
          - cabal.project
          - "*.cabal"
      path: ~/.cabal

pipelines:
  pull-requests:
    "**":
      - step: &run-tests
          name: Build and Test
          caches:
            - cabal-deps
          script:
            - apt-get update
            - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libpq-dev pkg-config ca-certificates
            - rm -rf /var/lib/apt/lists/*

            - cabal update
            - cabal build --only-dependencies --enable-tests

            - cabal test

  branches:
    main:
    - step: *run-tests
    - step:
        name: Dummy STep
        services:
          - docker
        script:
          - echo "HI"
          - docker --version
