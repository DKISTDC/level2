image: haskell:9.10.3-bookworm

definitions:
  services:
    docker:
      memory: 7168
  caches:
    cabal-deps:
      key:
        files:
          - cabal.project
          - "*.cabal"
      path: ~/.cabal

pipelines:
  pull-requests:
    "**":
      - step: &run-tests
          name: Build and Test
          caches:
            - cabal-deps
          script:
            - apt-get update
            - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libpq-dev pkg-config ca-certificates
            - rm -rf /var/lib/apt/lists/*

            - cabal update
            - cabal build --only-dependencies --enable-tests

            - cabal test

  branches:
    main:
    - step:
        name: Setup
        script:
          - echo "HI"
          - printenv | cut -d= -f1
          - echo "ARTIFACTORY_URL=$ARTIFACTORY_URL"
          - echo "ARTIFACTORY_USER=$ARTIFACTORY_USER"
          - echo "DOCKER_HOST=$DOCKER_HOST"
          - echo "DOCKER_HUB_URL=$DOCKER_HUB_URL"

          - TAG_BITBUCKET="$DOCKER_HUB_URL/level2:$VERSION_PREFIX.$BITBUCKET_BUILD_NUMBER"
          - TAG_SHA="$DOCKER_HUB_URL/level2:$VERSION_PREFIX.$SHORT_SHA"
          - TAG_LATEST="$DOCKER_HUB_URL/level2:latest"
          - echo "TAG_BITBUCKET=$TAG_BITBUCKET"
          - echo "TAG_SHA=$TAG_SHA"
          - echo "TAG_LATEST=$TAG_LATEST"
    # - step: *run-tests
    - step:
          name: Push to Artifactory
          size: 2x
          services:
            - docker
          caches:
            - docker
          script:
            - docker --version

            - echo "$ARTIFACTORY_PASSWORD" | docker login "$DOCKER_HUB_URL" --username "$ARTIFACTORY_USER" --password-stdin

            - SHORT_SHA=$(git rev-parse --short $BITBUCKET_COMMIT)
            - echo "COMMIT_SHORT_SHA=$SHORT_SHA"

            - TAG_BITBUCKET="$DOCKER_HUB_URL/level2:$VERSION_PREFIX.$BITBUCKET_BUILD_NUMBER"
            - TAG_SHA="$DOCKER_HUB_URL/level2:$VERSION_PREFIX.$SHORT_SHA"
            - TAG_LATEST="$DOCKER_HUB_URL/level2:latest"

            - docker build -t level2 .
            - docker tag level2 $TAG_BITBUCKET
            - docker tag level2 $TAG_SHA
            - docker tag level2 $TAG_LATEST
    
            - docker push $TAG_BITBUCKET
            - docker push $TAG_SHA
            - docker push $TAG_LATEST

